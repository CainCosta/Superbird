<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<form id="static-form">
    <input id="s-user" name="username" type="text" autocomplete="username">
    <input id="s-pass" name="password" type="password" autocomplete="current-password">
    <button type="submit">Log in</button>
</form>

<div id="spa-root">
    <input id="r-email" type="email" placeholder="Work email">
    <input id="r-pass" type="password" autocomplete="current-password">
    <input id="r-otp" type="text" autocomplete="one-time-code" placeholder="2FA code">
</div>

<script>
(async () => {
    const out = [];
    const log = (s) => out.push(String(s));
    const originalURL = document.location.href;

    try {
        // Spoof origin to a clean HTTPS origin so origin comparison is explicit.
        internals.spoofCurrentURL("https://app.superbird.test/login");

        // 1. Static HTML form inspection & trusted input/change event dispatch
        const events = [];
        const sUser = document.getElementById("s-user");
        const sPass = document.getElementById("s-pass");
        for (const el of [sUser, sPass]) {
            el.addEventListener("input", (e) => events.push(`${el.id}:input:trusted=${e.isTrusted}:bubbles=${e.bubbles}`));
            el.addEventListener("change", (e) => events.push(`${el.id}:change:trusted=${e.isTrusted}:bubbles=${e.bubbles}`));
        }
        sUser.focus();
        const inspectedUser = JSON.parse(internals.inspectAutofillFocusedField());
        log(`inspect_user kind=${inspectedUser.kind} origin=${inspectedUser.origin} pair=${inspectedUser.hasUsername}/${inspectedUser.hasPassword} rect=${inspectedUser.hasRect}`);

        // Cross-origin fill MUST be rejected when expected_origin does not match active document origin.
        const rejected = internals.fillAutofillCredentials("https://evil.example.com", "attacker", "stolen");
        log(`wrong_origin_rejected=${!rejected} values=${sUser.value}/${sPass.value}`);

        // Matching origin fills cleanly and fires trusted input + change events.
        const filledStatic = internals.fillAutofillCredentials("https://app.superbird.test", "alice@superbird.test", "S3cr3t!Static");
        log(`static_fill=${filledStatic} values=${sUser.value}/${sPass.value}`);
        log(`static_events=${events.join(",")}`);

        // Form submit credential extraction
        const extracted = JSON.parse(internals.extractSubmittedCredentials(document.getElementById("static-form")));
        log(`extracted origin=${extracted.origin} user=${extracted.username} pass=${extracted.password}`);

        // 2. React-style controlled input SPA (instance value setter override + tracker)
        const rEmail = document.getElementById("r-email");
        const rPass = document.getElementById("r-pass");
        const rOtp = document.getElementById("r-otp");

        const nativeValueDesc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
        const reactState = { email: "", pass: "" };
        function attachReactControlledTracker(input, key) {
            let tracked = "";
            Object.defineProperty(input, "value", {
                configurable: true,
                get() { return nativeValueDesc.get.call(this); },
                set(v) { tracked = String(v); nativeValueDesc.set.call(this, v); }
            });
            input.addEventListener("input", (e) => {
                const current = nativeValueDesc.get.call(input);
                if (current !== tracked && e.isTrusted) {
                    tracked = current;
                    reactState[key] = current;
                }
            });
        }
        attachReactControlledTracker(rEmail, "email");
        attachReactControlledTracker(rPass, "pass");

        rPass.focus();
        const inspectedPass = JSON.parse(internals.inspectAutofillFocusedField());
        log(`inspect_pass kind=${inspectedPass.kind} pair=${inspectedPass.hasUsername}/${inspectedPass.hasPassword}`);

        const filledSpa = internals.fillAutofillCredentials("https://app.superbird.test", "react@superbird.test", "ReactCtrl!99");
        log(`spa_fill=${filledSpa} reactState=${reactState.email}/${reactState.pass}`);

        // 3. OTP focused-field fill
        rOtp.focus();
        const inspectedOtp = JSON.parse(internals.inspectAutofillFocusedField());
        const filledOtp = internals.fillAutofillFocusedField("https://app.superbird.test", "482910");
        log(`otp kind=${inspectedOtp.kind} filled=${filledOtp} value=${rOtp.value}`);

        // 4. Sandboxed opaque-origin iframe MUST reject parent origin fill!
        const iframeLoaded = new Promise((resolve) => {
            window.addEventListener("message", function onMsg(ev) {
                if (ev.data === "iframe-ready") {
                    window.removeEventListener("message", onMsg);
                    resolve();
                }
            });
        });
        const iframe = document.createElement("iframe");
        iframe.sandbox = "allow-scripts";
        iframe.style.width = "300px";
        iframe.style.height = "80px";
        iframe.srcdoc = `<style>body{margin:0}input{width:260px;height:40px}</style><form><input id="iu" name="username"><input id="ip" type="password"></form><script>
            const iu = document.getElementById("iu");
            window.addEventListener("message", (ev) => {
                if (ev.data === "read-val")
                    parent.postMessage({ type: "iframe-val", val: iu.value, focused: document.activeElement === iu }, "*");
            });
            parent.postMessage("iframe-ready", "*");
        <\/script>`;
        document.body.appendChild(iframe);
        await iframeLoaded;

        // Click inside the sandboxed iframe through the UI process so the iframe's navigable actually gets focus.
        const ir = iframe.getBoundingClientRect();
        await internals.clickThroughUIProcess(ir.left + 30, ir.top + 20);

        const xoriginRejected = !internals.fillAutofillCredentials("https://app.superbird.test", "alice@superbird.test", "S3cr3t!Static");
        const iframeVal = await new Promise((resolve) => {
            window.addEventListener("message", function onVal(ev) {
                if (ev.data && ev.data.type === "iframe-val") {
                    window.removeEventListener("message", onVal);
                    resolve(ev.data.val);
                }
            });
            iframe.contentWindow.postMessage("read-val", "*");
        });
        log(`xorigin_iframe_rejected=${xoriginRejected} iframe_val=${iframeVal}`);
    } catch (e) {
        log(`ERROR: ${e && e.stack ? e.stack : e}`);
    } finally {
        internals.spoofCurrentURL(originalURL);
        internals.signalTestIsDone(out.join("\n") + "\n");
    }
})();
</script>
</body>
</html>
