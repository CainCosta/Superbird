name: Build Sidelady

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Build macOS arm64 bundle"
        type: boolean
        default: true
      build_linux:
        description: "Build Linux x86_64 bundle"
        type: boolean
        default: true

jobs:
  verify:
    name: Verify Patches & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Apply overlay and patches
        run: |
          git -C upstream config user.name "Sidelady CI"
          git -C upstream config user.email "ci@sidelady.local"
          ./scripts/apply.sh

      - name: Run TreeTabModel C++23 unit tests
        run: ./scripts/test-unit.sh

      - name: Syntax-check settings/tabs.js
        run: node --check upstream/Base/res/ladybird/about-pages/settings/tabs.js

  build-macos:
    name: Build macOS (arm64)
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.build_macos || github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Apply Sidelady overlay and patches
        shell: bash
        run: |
          git -C upstream config user.name "Sidelady CI"
          git -C upstream config user.email "ci@sidelady.local"
          ./scripts/apply.sh

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build dependencies
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew unlink openssl@3 || true
          brew install \
            autoconf \
            autoconf-archive \
            automake \
            bash \
            ccache \
            coreutils \
            libtool \
            nasm \
            ninja \
            pkg-config \
            sccache \
            unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Warm up pinned Rust toolchain
        working-directory: upstream
        shell: bash
        run: |
          rustup toolchain install
          cargo --version
          rustc --version

      - name: Set up Python environment
        working-directory: upstream
        shell: bash
        run: |
          python_bin=$(python3 Meta/Utils/python_environment.py --print-bin | tr -d '\r')
          echo "${python_bin}" >> "$GITHUB_PATH"
          echo "pythonLocation=$(dirname "${python_bin}")" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: upstream/Build/caches/vcpkg-binary-cache
          key: vcpkg-macos-arm64-${{ hashFiles('upstream/vcpkg.json') }}
          restore-keys: |
            vcpkg-macos-arm64-

      - name: Restore Cargo registry cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/registry
          key: cargo-macos-arm64-${{ hashFiles('upstream/Cargo.lock') }}
          restore-keys: |
            cargo-macos-arm64-

      - name: Restore compiler caches (ccache + sccache)
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            upstream/.ccache
            upstream/.sccache
          key: compiler-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-macos-arm64-

      - name: Bootstrap vcpkg
        working-directory: upstream
        shell: bash
        run: |
          python3 -c 'import pathlib, sys; sys.path.insert(0, "Meta"); from Utils.build_vcpkg import build_vcpkg; build_vcpkg(pathlib.Path("Build/vcpkg-distribution").resolve())'

      - name: Configure Sidelady & build vcpkg dependencies (macOS)
        working-directory: upstream
        shell: bash
        env:
          CCACHE_COMPILERCHECK: "%compiler% -v"
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          export LADYBIRD_SOURCE_DIR="$PWD"
          export LADYBIRD_MAIN_SOURCE_DIR="$PWD"
          export VCPKG_ROOT="$PWD/Build/vcpkg-distribution"
          export CCACHE_DIR="$PWD/.ccache"
          export SCCACHE_DIR="$PWD/.sccache"
          HOST_CC="$(xcrun --find clang)"
          HOST_CXX="$(xcrun --find clang++)"
          export CC="$HOST_CC"
          export CXX="$HOST_CXX"
          ccache -M 2G

          cmake --preset Distribution -B Build \
            -DLADYBIRD_BASELINE_CPU_TARGET=ON \
            -DLADYBIRD_ENABLE_LTO=OFF \
            -DLADYBIRD_GENERATE_SYMBOL_FILES=OFF \
            -DLADYBIRD_ENABLE_UPDATE_CHECK=OFF \
            -DLADYBIRD_ENABLE_SPARKLE=OFF \
            -DBUILD_TESTING=OFF \
            -DPython3_EXECUTABLE="${pythonLocation}/bin/python" \
            -DCMAKE_C_COMPILER="$HOST_CC" \
            -DCMAKE_CXX_COMPILER="$HOST_CXX"

      - name: Save vcpkg binary cache immediately
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: upstream/Build/caches/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build UI layer first (fail-fast on TreeTabs/Qt)
        working-directory: upstream
        shell: bash
        env:
          CCACHE_COMPILERCHECK: "%compiler% -v"
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          export SCCACHE_DIR="$PWD/.sccache"
          cmake --build Build --target ladybird_impl

      - name: Build & install full macOS bundle
        working-directory: upstream
        shell: bash
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          export SCCACHE_DIR="$PWD/.sccache"
          cmake --build Build --target sign_ladybird_bundle
          cmake --install Build --strip --component ladybird_Runtime --prefix "$PWD/../Install"
          ccache -s
        env:
          CCACHE_COMPILERCHECK: "%compiler% -v"
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_IDLE_TIMEOUT: "0"

      - name: Stop sccache & prune ccache before saving
        if: always()
        working-directory: upstream
        shell: bash
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          sccache --stop-server || true
          ccache --evict-older-than=1d || true
          ccache -s || true

      - name: Save Cargo registry cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/registry
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Save compiler caches (ccache + sccache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            upstream/.ccache
            upstream/.sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Re-sign & package portable macOS app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$PWD/Install/bundle/Ladybird.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "Error: Installed Ladybird.app not found at $APP_PATH!" >&2
            exit 1
          fi

          # Strip build-tree rpaths from bundled dylibs/plugins and re-sign inside-out
          # after `cmake --install --strip` invalidated the build-time ad-hoc signatures.
          python3 - "$APP_PATH" "$PWD/upstream/Build" "$PWD/upstream/Meta/Entitlements.plist" <<'PY'
          import os, subprocess, sys
          from pathlib import Path

          app = Path(sys.argv[1])
          build_dir = Path(sys.argv[2])
          main_entitlements = Path(sys.argv[3])
          macho_magics = (b"\xcf\xfa\xed\xfe", b"\xce\xfa\xed\xfe", b"\xca\xfe\xba\xbe", b"\xbe\xba\xfe\xca")

          def is_macho(p: Path) -> bool:
              if p.is_symlink() or not p.is_file():
                  return False
              with p.open("rb") as f:
                  return f.read(4) in macho_magics

          def rpaths(p: Path) -> list[str]:
              out = subprocess.check_output(["otool", "-l", str(p)], text=True)
              res, flag = [], False
              for line in out.splitlines():
                  s = line.strip()
                  if s == "cmd LC_RPATH":
                      flag = True
                  elif flag and s.startswith("path "):
                      res.append(s[len("path "):].split(" (offset")[0])
                      flag = False
              return res

          contents = app / "Contents"
          for subdir in ("lib", "PlugIns", "Frameworks"):
              d = contents / subdir
              if not d.is_dir():
                  continue
              for p in sorted(d.rglob("*")):
                  if not is_macho(p):
                      continue
                  p.chmod(p.stat().st_mode | 0o200)
                  for rp in rpaths(p):
                      if rp.startswith("/"):
                          subprocess.run(["install_name_tool", "-delete_rpath", rp, str(p)], check=True)
                  subprocess.run(["codesign", "--sign", "-", "--force", str(p)], check=True)

          macos_dir = contents / "MacOS"
          main_bin = macos_dir / "Ladybird"
          for exe in sorted(macos_dir.iterdir()):
              if not is_macho(exe):
                  continue
              exe.chmod(exe.stat().st_mode | 0o200)
              for rp in rpaths(exe):
                  if rp.startswith("/"):
                      subprocess.run(["install_name_tool", "-delete_rpath", rp, str(exe)], check=True)
              if "@executable_path/../lib" not in rpaths(exe):
                  subprocess.run(["install_name_tool", "-add_rpath", "@executable_path/../lib", str(exe)], check=True)
              if exe == main_bin:
                  continue
              cmd = ["codesign", "--sign", "-", "--force"]
              ent = next(build_dir.glob(f"Services/**/{exe.name}.entitlements"), None)
              if ent is not None and ent.is_file():
                  cmd += ["--options", "runtime", "--entitlements", str(ent)]
              subprocess.run([*cmd, str(exe)], check=True)

          subprocess.run(["codesign", "--sign", "-", "--force", "--entitlements", str(main_entitlements), str(app)], check=True)

          for subdir in ("MacOS", "lib", "PlugIns", "Frameworks"):
              d = contents / subdir
              if not d.is_dir():
                  continue
              for p in sorted(d.rglob("*")):
                  if is_macho(p):
                      subprocess.run(["codesign", "--verify", str(p)], check=True)
          subprocess.run(["codesign", "--verify", str(app)], check=True)
          print(f"Verified portable macOS bundle signatures for {app}")
          PY

          mkdir -p packages
          echo "Packaging $APP_PATH..."
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" packages/Sidelady-macOS-arm64.zip
          ls -lh packages/Sidelady-macOS-arm64.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sidelady-macOS-arm64
          path: packages/Sidelady-macOS-arm64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (x86_64)
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.build_linux || github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ladybirdbrowser/ladybird-ci:2026.11.21
      options: --ulimit core=1
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Apply Sidelady overlay and patches
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          git config --global --add safe.directory "$PWD/upstream"
          git -C upstream config user.name "Sidelady CI"
          git -C upstream config user.email "ci@sidelady.local"
          ./scripts/apply.sh

      - name: Set up Python environment
        working-directory: upstream
        shell: bash
        run: |
          python_bin=$(python3 Meta/Utils/python_environment.py --print-bin | tr -d '\r')
          echo "${python_bin}" >> "$GITHUB_PATH"
          echo "pythonLocation=$(dirname "${python_bin}")" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: upstream/Build/caches/vcpkg-binary-cache
          key: vcpkg-linux-x86_64-${{ hashFiles('upstream/vcpkg.json') }}
          restore-keys: |
            vcpkg-linux-x86_64-

      - name: Restore Cargo registry cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            /opt/cargo/registry
          key: cargo-linux-x86_64-${{ hashFiles('upstream/Cargo.lock') }}
          restore-keys: |
            cargo-linux-x86_64-

      - name: Restore compiler caches (ccache + sccache)
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            upstream/.ccache
            upstream/.sccache
          key: compiler-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-linux-x86_64-

      - name: Bootstrap vcpkg
        working-directory: upstream
        shell: bash
        run: |
          python3 -c 'import pathlib, sys; sys.path.insert(0, "Meta"); from Utils.build_vcpkg import build_vcpkg; build_vcpkg(pathlib.Path("Build/vcpkg-distribution").resolve())'

      - name: Configure Sidelady & build vcpkg dependencies (Linux)
        working-directory: upstream
        shell: bash
        env:
          CCACHE_COMPILERCHECK: "%compiler% -v"
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_IDLE_TIMEOUT: "0"
          CC: clang
          CXX: clang++
        run: |
          export LADYBIRD_SOURCE_DIR="$PWD"
          export LADYBIRD_MAIN_SOURCE_DIR="$PWD"
          export VCPKG_ROOT="$PWD/Build/vcpkg-distribution"
          export CCACHE_DIR="$PWD/.ccache"
          export SCCACHE_DIR="$PWD/.sccache"
          ccache -M 2G

          cmake --preset Distribution -B Build \
            -DLADYBIRD_BASELINE_CPU_TARGET=ON \
            -DLADYBIRD_ENABLE_LTO=OFF \
            -DLADYBIRD_GENERATE_SYMBOL_FILES=OFF \
            -DLADYBIRD_ENABLE_UPDATE_CHECK=OFF \
            -DBUILD_TESTING=OFF \
            -DPython3_EXECUTABLE="${pythonLocation}/bin/python" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Save vcpkg binary cache immediately
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: upstream/Build/caches/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build UI layer first (fail-fast on TreeTabs/Qt)
        working-directory: upstream
        shell: bash
        env:
          CCACHE_COMPILERCHECK: "%compiler% -v"
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          export SCCACHE_DIR="$PWD/.sccache"
          cmake --build Build --target ladybird_impl

      - name: Build & install full Linux bundle
        working-directory: upstream
        shell: bash
        env:
          CCACHE_COMPILERCHECK: "%compiler% -v"
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          export SCCACHE_DIR="$PWD/.sccache"
          cmake --build Build --target ladybird WebDriver
          cmake --install Build --strip --component ladybird_Runtime --prefix "$PWD/../Install"
          ccache -s

      - name: Stop sccache & prune ccache before saving
        if: always()
        working-directory: upstream
        shell: bash
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          sccache --stop-server || true
          ccache --evict-older-than=1d || true
          ccache -s || true

      - name: Save Cargo registry cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            /opt/cargo/registry
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Save compiler caches (ccache + sccache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            upstream/.ccache
            upstream/.sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package Linux archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$PWD/Install/bin/Ladybird" ]]; then
            echo "Error: Installed Ladybird binary not found at $PWD/Install/bin/Ladybird!" >&2
            exit 1
          fi
          mkdir -p packages
          tar -C "$PWD/Install" -cJf packages/Sidelady-Linux-x86_64.tar.xz .
          ls -lh packages/Sidelady-Linux-x86_64.tar.xz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sidelady-Linux-x86_64
          path: packages/Sidelady-Linux-x86_64.tar.xz
          if-no-files-found: error
