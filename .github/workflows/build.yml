name: Build Superbird

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Build macOS arm64 bundle"
        type: boolean
        default: true
      build_linux:
        description: "Build Linux x86_64 bundle"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Verify Patches & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Apply overlay and patches
        run: |
          git -C upstream config user.name "Superbird CI"
          git -C upstream config user.email "ci@superbird.local"
          ./scripts/apply.sh

      - name: Run Superbird C++23 unit tests
        run: ./scripts/test-unit.sh

      - name: Syntax-check settings JS
        run: |
          node --check upstream/Base/res/ladybird/about-pages/settings/tabs.js
          node --check upstream/Base/res/ladybird/about-pages/settings/superbird.js

  build-macos:
    name: Build macOS (arm64)
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.build_macos || github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Apply Superbird overlay and patches
        shell: bash
        run: |
          git -C upstream config user.name "Superbird CI"
          git -C upstream config user.email "ci@superbird.local"
          ./scripts/apply.sh

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build dependencies
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew unlink openssl@3 || true
          brew install \
            autoconf \
            autoconf-archive \
            automake \
            bash \
            ccache \
            coreutils \
            libtool \
            nasm \
            ninja \
            pkg-config \
            sccache \
            unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Warm up pinned Rust toolchain
        working-directory: upstream
        shell: bash
        run: |
          rustup toolchain install
          cargo --version
          rustc --version

      - name: Set up Python environment
        working-directory: upstream
        shell: bash
        run: |
          python_bin=$(python3 Meta/Utils/python_environment.py --print-bin | tr -d '\r')
          echo "${python_bin}" >> "$GITHUB_PATH"
          echo "pythonLocation=$(dirname "${python_bin}")" >> "$GITHUB_ENV"

      - name: Capture runner image version
        id: runner-env
        shell: bash
        run: |
          img="${ImageVersion:-$(sw_vers -buildVersion)-$(xcodebuild -version | awk '/Build version/{print $3}')}"
          echo "image_version=${img}" >> "$GITHUB_OUTPUT"
          echo "Runner image version: ${img}"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: upstream/Build/caches/vcpkg-binary-cache
          key: vcpkg-macos-arm64-${{ steps.runner-env.outputs.image_version }}-${{ hashFiles('upstream/vcpkg.json') }}
          restore-keys: |
            vcpkg-macos-arm64-${{ steps.runner-env.outputs.image_version }}-
            vcpkg-macos-arm64-

      - name: Restore Cargo registry cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/registry
          key: cargo-macos-arm64-${{ hashFiles('upstream/Cargo.lock') }}
          restore-keys: |
            cargo-macos-arm64-

      - name: Restore compiler caches (ccache + sccache)
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            upstream/.ccache
            upstream/.sccache
          key: compiler-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-macos-arm64-

      - name: Bootstrap vcpkg
        working-directory: upstream
        shell: bash
        run: |
          python3 -c 'import pathlib, sys; sys.path.insert(0, "Meta"); from Utils.build_vcpkg import build_vcpkg; build_vcpkg(pathlib.Path("Build/vcpkg-distribution").resolve())'

      - name: Configure Superbird & build vcpkg dependencies (macOS)
        working-directory: upstream
        shell: bash
        env:
          CCACHE_COMPILERCHECK: "%compiler% -v"
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          export LADYBIRD_SOURCE_DIR="$PWD"
          export LADYBIRD_MAIN_SOURCE_DIR="$PWD"
          export VCPKG_ROOT="$PWD/Build/vcpkg-distribution"
          export CCACHE_DIR="$PWD/.ccache"
          export SCCACHE_DIR="$PWD/.sccache"
          HOST_CC="$(xcrun --find clang)"
          HOST_CXX="$(xcrun --find clang++)"
          export CC="$HOST_CC"
          export CXX="$HOST_CXX"
          ccache -M 2G

          cmake --preset Distribution -B Build \
            -DLADYBIRD_BASELINE_CPU_TARGET=ON \
            -DLADYBIRD_ENABLE_LTO=OFF \
            -DLADYBIRD_GENERATE_SYMBOL_FILES=OFF \
            -DLADYBIRD_ENABLE_UPDATE_CHECK=OFF \
            -DLADYBIRD_ENABLE_SPARKLE=OFF \
            -DBUILD_TESTING=OFF \
            -DPython3_EXECUTABLE="${pythonLocation}/bin/python" \
            -DCMAKE_C_COMPILER="$HOST_CC" \
            -DCMAKE_CXX_COMPILER="$HOST_CXX"

      - name: Save vcpkg binary cache immediately
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: upstream/Build/caches/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build UI layer first (fail-fast on Superbird/Qt)
        working-directory: upstream
        shell: bash
        env:
          CCACHE_COMPILERCHECK: "%compiler% -v"
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          export SCCACHE_DIR="$PWD/.sccache"
          cmake --build Build --target ladybird_impl

      - name: Build & install full macOS bundle
        working-directory: upstream
        shell: bash
        env:
          CCACHE_COMPILERCHECK: "%compiler% -v"
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          export SCCACHE_DIR="$PWD/.sccache"
          cmake --build Build --target sign_ladybird_bundle
          cmake --install Build --strip --component ladybird_Runtime --prefix "$PWD/../Install"
          ccache -s

      - name: Stop sccache & prune ccache before saving
        if: always()
        working-directory: upstream
        shell: bash
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          sccache --stop-server || true
          ccache --evict-older-than=1d || true
          ccache -s || true

      - name: Save Cargo registry cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/registry
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Save compiler caches (ccache + sccache)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            upstream/.ccache
            upstream/.sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Prune older macOS compiler caches
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_KEY: ${{ steps.compiler-cache.outputs.cache-primary-key }}
        run: |
          python3 - <<'PY' || true
          import json, os, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          keep = os.environ["KEEP_KEY"]
          ref = os.environ["GITHUB_REF"]
          prefix = "compiler-macos-arm64-"
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          url = f"https://api.github.com/repos/{repo}/actions/caches?per_page=100&key={prefix}"
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as resp:
              caches = json.loads(resp.read().decode()).get("actions_caches", [])
          # Only prune if the new cache exists so we never leave the platform with zero compiler cache.
          if not any(c.get("key") == keep and c.get("ref") == ref for c in caches):
              print(f"Skipping prune: new cache {keep} on {ref} not listed yet.")
              raise SystemExit(0)
          for c in caches:
              if c.get("key") == keep and c.get("ref") == ref:
                  continue
              cid = c["id"]
              del_req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/caches/{cid}",
                  headers=headers,
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(del_req):
                      print(f"Pruned old cache {c['key']} (id={cid})")
              except Exception as e:
                  print(f"Could not prune cache {cid}: {e}")
          PY

      - name: Re-sign & package portable macOS app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$PWD/Install/bundle/Superbird.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "Error: Installed Superbird.app not found at $APP_PATH!" >&2
            exit 1
          fi

          # Strip build-tree rpaths from bundled dylibs/plugins and re-sign inside-out
          # after `cmake --install --strip` invalidated the build-time ad-hoc signatures.
          python3 scripts/macos-bundle.py "$APP_PATH" "$PWD/upstream/Build" "$PWD/upstream/Meta/Entitlements.plist"

          mkdir -p packages
          echo "Packaging $APP_PATH..."
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" packages/Superbird-macOS-arm64.zip
          ls -lh packages/Superbird-macOS-arm64.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Superbird-macOS-arm64
          path: packages/Superbird-macOS-arm64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (x86_64)
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.build_linux || github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ladybirdbrowser/ladybird-ci:2026.11.21
      options: --ulimit core=1
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Apply Superbird overlay and patches
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          git config --global --add safe.directory "$PWD/upstream"
          git -C upstream config user.name "Superbird CI"
          git -C upstream config user.email "ci@superbird.local"
          ./scripts/apply.sh

      - name: Set up Python environment
        working-directory: upstream
        shell: bash
        run: |
          python_bin=$(python3 Meta/Utils/python_environment.py --print-bin | tr -d '\r')
          echo "${python_bin}" >> "$GITHUB_PATH"
          echo "pythonLocation=$(dirname "${python_bin}")" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: upstream/Build/caches/vcpkg-binary-cache
          key: vcpkg-linux-x86_64-${{ hashFiles('upstream/vcpkg.json') }}
          restore-keys: |
            vcpkg-linux-x86_64-

      - name: Restore Cargo registry cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            /opt/cargo/registry
          key: cargo-linux-x86_64-${{ hashFiles('upstream/Cargo.lock') }}
          restore-keys: |
            cargo-linux-x86_64-

      - name: Restore compiler caches (ccache + sccache)
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            upstream/.ccache
            upstream/.sccache
          key: compiler-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-linux-x86_64-

      - name: Bootstrap vcpkg
        working-directory: upstream
        shell: bash
        run: |
          python3 -c 'import pathlib, sys; sys.path.insert(0, "Meta"); from Utils.build_vcpkg import build_vcpkg; build_vcpkg(pathlib.Path("Build/vcpkg-distribution").resolve())'

      - name: Configure Superbird & build vcpkg dependencies (Linux)
        working-directory: upstream
        shell: bash
        env:
          CCACHE_COMPILERCHECK: "%compiler% -v"
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_IDLE_TIMEOUT: "0"
          CC: clang
          CXX: clang++
        run: |
          export LADYBIRD_SOURCE_DIR="$PWD"
          export LADYBIRD_MAIN_SOURCE_DIR="$PWD"
          export VCPKG_ROOT="$PWD/Build/vcpkg-distribution"
          export CCACHE_DIR="$PWD/.ccache"
          export SCCACHE_DIR="$PWD/.sccache"
          ccache -M 2G

          cmake --preset Distribution -B Build \
            -DLADYBIRD_BASELINE_CPU_TARGET=ON \
            -DLADYBIRD_ENABLE_LTO=OFF \
            -DLADYBIRD_GENERATE_SYMBOL_FILES=OFF \
            -DLADYBIRD_ENABLE_UPDATE_CHECK=OFF \
            -DBUILD_TESTING=OFF \
            -DPython3_EXECUTABLE="${pythonLocation}/bin/python" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Save vcpkg binary cache immediately
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: upstream/Build/caches/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build UI layer first (fail-fast on Superbird/Qt)
        working-directory: upstream
        shell: bash
        env:
          CCACHE_COMPILERCHECK: "%compiler% -v"
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          export SCCACHE_DIR="$PWD/.sccache"
          cmake --build Build --target ladybird_impl

      - name: Build & install full Linux bundle
        working-directory: upstream
        shell: bash
        env:
          CCACHE_COMPILERCHECK: "%compiler% -v"
          SCCACHE_CACHE_SIZE: 1G
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          export SCCACHE_DIR="$PWD/.sccache"
          cmake --build Build --target ladybird WebDriver
          cmake --install Build --strip --component ladybird_Runtime --prefix "$PWD/../Install"
          ccache -s

      - name: Stop sccache & prune ccache before saving
        if: always()
        working-directory: upstream
        shell: bash
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          sccache --stop-server || true
          ccache --evict-older-than=1d || true
          ccache -s || true

      - name: Save Cargo registry cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            /opt/cargo/registry
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Save compiler caches (ccache + sccache)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            upstream/.ccache
            upstream/.sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Prune older Linux compiler caches
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_KEY: ${{ steps.compiler-cache.outputs.cache-primary-key }}
        run: |
          python3 - <<'PY' || true
          import json, os, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          keep = os.environ["KEEP_KEY"]
          ref = os.environ["GITHUB_REF"]
          prefix = "compiler-linux-x86_64-"
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          url = f"https://api.github.com/repos/{repo}/actions/caches?per_page=100&key={prefix}"
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as resp:
              caches = json.loads(resp.read().decode()).get("actions_caches", [])
          # Only prune if the new cache exists so we never leave the platform with zero compiler cache.
          if not any(c.get("key") == keep and c.get("ref") == ref for c in caches):
              print(f"Skipping prune: new cache {keep} on {ref} not listed yet.")
              raise SystemExit(0)
          for c in caches:
              if c.get("key") == keep and c.get("ref") == ref:
                  continue
              cid = c["id"]
              del_req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/caches/{cid}",
                  headers=headers,
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(del_req):
                      print(f"Pruned old cache {c['key']} (id={cid})")
              except Exception as e:
                  print(f"Could not prune cache {cid}: {e}")
          PY

      - name: Package Linux archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$PWD/Install/bin/Superbird" ]]; then
            echo "Error: Installed Superbird binary not found at $PWD/Install/bin/Superbird!" >&2
            exit 1
          fi
          mkdir -p packages
          tar -C "$PWD/Install" -cJf packages/Superbird-Linux-x86_64.tar.xz .
          ls -lh packages/Superbird-Linux-x86_64.tar.xz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Superbird-Linux-x86_64
          path: packages/Superbird-Linux-x86_64.tar.xz
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: [build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS bundle
        uses: actions/download-artifact@v4
        with:
          name: Superbird-macOS-arm64
          path: assets

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: Superbird-Linux-x86_64
          path: assets

      - name: Attach bundles to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd assets && sha256sum Superbird-* > SHA256SUMS.txt)
          ls -lh assets
          cat assets/SHA256SUMS.txt
          # If the release already exists (e.g. drafted with hand-written notes before tagging),
          # upload assets without touching notes, title, or the prerelease flag. Otherwise create it.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" assets/* --clobber
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" assets/* \
              --title "Superbird $RELEASE_TAG" \
              --generate-notes \
              --prerelease
          else
            gh release create "$RELEASE_TAG" assets/* \
              --title "Superbird $RELEASE_TAG" \
              --generate-notes
          fi
